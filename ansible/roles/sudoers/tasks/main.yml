---
- name: Configure intended sudo less privesc
  ansible.builtin.copy:
    dest: /etc/sudoers.d/helpforge-techops
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'
    content: |
      # HelpForge: legacy log-review rule left in place after junior sysadmin departure
      techops ALL=(root) NOPASSWD: /usr/bin/less /var/log/glpi/helpforge.log
