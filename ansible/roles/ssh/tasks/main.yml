---
- name: Configure SSH daemon
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
  loop:
    - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
    - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication yes' }
    - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
    - { regexp: '^#?MaxAuthTries', line: 'MaxAuthTries 5' }
    - { regexp: '^#?LoginGraceTime', line: 'LoginGraceTime 30' }
  notify: restart ssh

- name: Remove cloud image SSH override
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d/60-cloudimg-settings.conf
    state: absent
  notify: restart ssh

- name: Allow only challenge and build users during provisioning
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^AllowUsers'
    line: 'AllowUsers techops vagrant'
  notify: restart ssh
