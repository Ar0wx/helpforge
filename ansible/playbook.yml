---
- name: Provision HelpForge CTF Machine
  hosts: all
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3
  roles:
    - base
    - users
    - glpi
    - ftp
    - ssh
    - sudoers
    - logs
    - flags
    - harden
    - role: verify
      tags: ['verify', 'never']
    # Logging / observability: runs automatically on `vagrant up` so the VM is
    # ready for log collection with no manual steps (Chapter 7 instrumentation).
    # The 'audit' tag is kept so the role can still be re-applied on its own via
    # ./audit.sh, but it is no longer gated behind 'never'.
    - role: audit
      tags: ['audit']
    # SIEM integration (Chapter 8): Fleet-enroll the Elastic Agent and ship the
    # non-Fleet sources via standalone Filebeat. Runs on `vagrant up` but is a
    # no-op unless a Fleet enrollment token is present (see Vagrantfile), so the
    # challenge stays standalone when shipped without the ELK server. Must run
    # after 'audit' so /var/log/audit/audit.log and the MySQL general log exist.
    - role: elastic_agent
      tags: ['siem']
    - role: cleanup
      tags: ['cleanup', 'never']
